<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>CORS Safe Request Example</title>
</head>
<body>
    <h2>بيانات الحساب</h2>
    <button id="fetch-btn">جلب البيانات</button>
    <pre id="output"></pre>

    <script>
        document.getElementById('fetch-btn').addEventListener('click', () => {
            // إرسال طلب إلى API السيرفر
            fetch('http://localhost:8000/api.php', {
                method: 'GET',
                // تضمين الكوكيز أو الاعتمادات مع الطلب عبر النطاقات (Cross-Origin)
                credentials: 'include'
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error('فشل الطلب بسبب سياسة CORS أو خطأ في السيرفر');
                }
                return response.json();
            })
            .then(data => {
                document.getElementById('output').innerText = JSON.stringify(data, null, 2);
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById('output').innerText = error.message;
            });
        });
    </script>
</body>
</html>
